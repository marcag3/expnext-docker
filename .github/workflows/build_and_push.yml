name: Build and Push Custom ERPNext Image

on:
  schedule:
    - cron: '0 0 * * 1'  # Weekly build on Monday at midnight
  workflow_dispatch:
  push:
    branches:
      - v15
      - v16

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Log in to the Container registry
      uses: docker/login-action@v4
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-

    - name: Generate APPS_JSON_BASE64
      id: apps_json
      run: |
        APPS_JSON=$(cat apps.json)
        echo "apps_json_base64=$(echo $APPS_JSON | base64 -w 0)" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build and Push Docker Image
      uses: docker/build-push-action@v7
      with:
        context: .
        file: src/variations/erpnext-nginx/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: |
          APPS_JSON_BASE64=${{ steps.apps_json.outputs.apps_json_base64 }}
        cache-from: |
          type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-buildcache
          type=gha,scope=${{ github.ref_name }}
        cache-to: |
          type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-buildcache,mode=max,compression=zstd
          type=gha,mode=max,scope=${{ github.ref_name }}

