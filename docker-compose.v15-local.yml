# Local v15 stack restored from production dump.
# Usage:
#   docker compose -f docker-compose.v15-local.yml up -d
#   docker compose -f docker-compose.v15-local.yml exec -u frappe web bench --site frontend list-apps
name: erpnext-v15-local

services:
  web:
    image: ghcr.io/marcag3/erpnext-custom:v15-local
    platform: linux/amd64
    environment:
      DB_PASSWORD: "${DB_PASSWORD}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      AUTORUN_ENABLED: "true"
      INSTALL_APPS: ""
    volumes:
      - ./sites:/home/frappe/frappe-bench/sites/frontend
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  queue:
    image: ghcr.io/marcag3/erpnext-custom:v15-local
    platform: linux/amd64
    command: ["bench", "worker", "--queue", "long,default,short"]
    stop_signal: SIGTERM
    environment:
      DB_PASSWORD: "${DB_PASSWORD}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      AUTORUN_ENABLED: "false"
    volumes:
      - ./sites:/home/frappe/frappe-bench/sites/frontend
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  scheduler:
    image: ghcr.io/marcag3/erpnext-custom:v15-local
    platform: linux/amd64
    command: ["bench", "schedule"]
    stop_signal: SIGTERM
    environment:
      DB_PASSWORD: "${DB_PASSWORD}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      AUTORUN_ENABLED: "false"
    volumes:
      - ./sites:/home/frappe/frappe-bench/sites/frontend
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  db:
    image: mariadb:10.6
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s
    volumes:
      - ./db-data-v15-local:/var/lib/mysql

  redis-cache:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
      timeout: 3s

  redis-queue:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
      timeout: 3s

volumes:
  db-data-v15-local:
