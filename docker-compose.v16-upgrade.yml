# Upgrade existing v15 site data to v16 (uses ./sites and ./db-data).
# Prerequisite: rebuild image after updating apps.json
#   ./build.sh
# Usage:
#   docker compose -f docker-compose.v16-upgrade.yml up -d
#   docker compose -f docker-compose.v16-upgrade.yml logs -f web
#   docker compose -f docker-compose.v16-upgrade.yml exec -u frappe web bench --site frontend list-apps
name: erpnext-v16-upgrade

services:
  web:
    image: ghcr.io/marcag3/erpnext-custom:latest
    platform: linux/amd64
    environment:
      DB_PASSWORD: "${DB_PASSWORD}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      AUTORUN_ENABLED: "true"
    volumes:
      - ./sites:/home/frappe/frappe-bench/sites/frontend
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  queue:
    image: ghcr.io/marcag3/erpnext-custom:latest
    platform: linux/amd64
    command: ["bench", "worker", "--queue", "long,default,short"]
    stop_signal: SIGTERM
    environment:
      DB_PASSWORD: "${DB_PASSWORD}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      AUTORUN_ENABLED: "false"
    volumes:
      - ./sites:/home/frappe/frappe-bench/sites/frontend
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  scheduler:
    image: ghcr.io/marcag3/erpnext-custom:latest
    platform: linux/amd64
    command: ["bench", "schedule"]
    stop_signal: SIGTERM
    environment:
      DB_PASSWORD: "${DB_PASSWORD}"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      AUTORUN_ENABLED: "false"
    volumes:
      - ./sites:/home/frappe/frappe-bench/sites/frontend
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
      redis-queue:
        condition: service_healthy

  db:
    image: mariadb:11.8
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s
    volumes:
      - ./db-data:/var/lib/mysql

  redis-cache:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
      timeout: 3s
    volumes:
      - type: volume
        source: redis-cache-data
        target: /data
        volume: {}

  redis-queue:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
      timeout: 3s
    volumes:
      - type: volume
        source: redis-queue-data
        target: /data
        volume: {}

networks:
  default:
    name: erpnext-v16-upgrade

volumes:
  redis-cache-data:
    name: erpnext_v16_upgrade_redis-cache-data
  redis-queue-data:
    name: erpnext_v16_upgrade_redis-queue-data
